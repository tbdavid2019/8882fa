name = "8882fa"
main = "src/worker.js"
compatibility_date = "2024-01-13"
workers_dev = true

# KV 名稱空間
# 始終宣告 SECRETS_KV，避免 Git 自動構建部署時丟失繫結。
# 新版 Wrangler 會在首次部署時自動建立或保持已連結的 KV 資源。
# 如需固定到指定資源，可在本地補充 id / preview_id。
[[kv_namespaces]]
binding = "SECRETS_KV"

# 環境變數 (Secrets)
# 注意：敏感資訊使用 Cloudflare Secrets 安全儲存
#
# 生產環境（預設）設定：
#   npx wrangler secret put ENCRYPTION_KEY    # 加密金鑰（可選，用於資料加密）
#
# 開發環境設定：
#   npx wrangler secret put ENCRYPTION_KEY --env development
#
# 詳細配置指南：docs/DEPLOYMENT.md

# 定時任務配置 - 每天凌晨0點（北京時間）自動備份（Free 計劃賬戶全域性上限 5 個 cron，如需可取消註釋啟用）
# [triggers]
# crons = ["0 16 * * *"]

# ====================================
# 🚀 Service Worker 自動版本管理
# ====================================
# SW_VERSION 將在部署時通過 scripts/generate-version.js 自動生成
# 支援三種版本策略：
#   - 時間戳（預設）：v20250102-123456
#   - Git commit：v<short-hash>
#   - Package版本：v1.0.0
#
# 使用方式：
#   npm run deploy              # 使用時間戳版本
#   npm run deploy:git          # 使用 git commit 版本
#   npm run deploy:package      # 使用 package.json 版本
#
# 注意：版本號由部署指令碼注入，此處的值僅用於本地開發
# ENVIRONMENT 預設為 production，確保任何直達部署入口（wrangler deploy、Git 自動構建）
# 都能拿到長快取；本地開發請走 `npm run dev`（已繫結 --env development）
[vars]
SW_VERSION = "v1"
ENVIRONMENT = "production"

# ====================================
# 開發/測試環境配置
# ====================================
[env.development]
name = "8882fa-dev"

# 繫結項不可繼承，開發環境也需要顯式宣告。
[[env.development.kv_namespaces]]
binding = "SECRETS_KV"

[env.development.vars]
ENVIRONMENT = "development"
SW_VERSION = "v1"
